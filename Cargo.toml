[workspace]
members = [
    "lib/fossil-lang",
    # fossil-lsp: needs rewrite to use Salsa queries (Phase 4)
    # fossil-doc: needs Polars removal + fossil-providers decouple (Phase 5)
    # Excluded from workspace until refactored:
    # "lib/fossil-lsp",
    # "lib/fossil-doc",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
description = "A small language for living data"
homepage = ""
repository = ""
documentation = ""
license = ""
categories = ["database"]
keywords = [""]
authors = ["Ángel Iglesias Préstamo <angel.iglesias.prestamo@gmail.com>"]
edition = "2024"
rust-version = "1.90.0"

[workspace.dependencies]
# external dependencies
thiserror = "2.0.18"

# internal dependencies
fossil-lang = { path = "./lib/fossil-lang" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
